name: s60_inventory_app
description: "S60 Inventory & Rewards Management System for Super60, Department of CSE, SVIET"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  google_fonts: ^6.1.0
  fl_chart: ^0.66.0
  flutter_svg: ^2.0.10+1
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/s60_logo.png
    - assets/sviet_logo.png
    - assets/app_icon.png
    - assets/favicon.png
    - assets/sviet_campus.png
    - assets/sviet_s60_header_logos.png
    - assets/s60_symbol.png
