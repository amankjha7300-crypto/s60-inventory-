version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: s60_postgres
    restart: always
    environment:
      POSTGRES_USER: s60admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: s60inventory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: s60_fastapi
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://s60admin:password123@db:5432/s60inventory
      JWT_SECRET: super60_sviet_management_secret_key_change_in_production_2026
      ENVIRONMENT: production
      PORT: 8000
    ports:
      - "8000:8000"

volumes:
  postgres_data:
