services:
  - type: web
    name: s60-inventory
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: s60-inventory-db
          property: connectionString

databases:
  - name: s60-inventory-db
    plan: free
    region: singapore
    databaseName: s60inventory
    user: s60admin
